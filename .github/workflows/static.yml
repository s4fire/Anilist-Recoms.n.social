# Deploy the Vite frontend to GitHub Pages
# Manual redeploy trigger: keep the deployment pipeline unchanged.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pages/package-lock.json
      - name: Install dependencies
        working-directory: pages
        run: npm ci
      - name: Build
        working-directory: pages
        env:
          VITE_ANILIST_CLIENT_ID: ${{ vars.VITE_ANILIST_CLIENT_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Backend smoke tests
        env:
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          base="https://cjqojssmgxaugqztdlxd.supabase.co/functions/v1"
          test_auth="$(curl -sS -o /tmp/auth-response.json -w "%{http_code}" \
            -X POST \
            -H "Origin: https://s4fire.github.io" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            --data '{}' \
            "$base/auth-anilist")"
          [ "$test_auth" = "400" ]
          python - <<'PY'
          import json
          with open("/tmp/auth-response.json", "r", encoding="utf-8") as f:
              body = json.load(f)
          assert isinstance(body, dict) and isinstance(body.get("error"), str) and body["error"]
          PY

          for fn in anilist-add-to-list anilist-disconnect anilist-list-options; do
            status="$(curl -sS -o /tmp/"$fn"-response.txt -w "%{http_code}" \
              -X POST \
              -H "Origin: https://s4fire.github.io" \
              -H "Content-Type: application/json" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              --data '{}' \
              "$base/$fn")"
            [ "$status" = "401" ]
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

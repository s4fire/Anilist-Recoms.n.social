<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1115" />
    <meta name="description" content="A quieter place to talk anime with your people." />
    <script>
      (() => {
        const root = document.documentElement;
        const allowed = ['ink', 'sakura-night', 'tokyo', 'mist'];
        let saved = null;
        try { saved = localStorage.getItem('arns-theme'); } catch { /* Use the dark default when storage is unavailable. */ }
        root.dataset.theme = allowed.includes(saved) ? saved : 'ink';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>ARNS — AniList recommendations, together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
